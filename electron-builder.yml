# Packaging config for `npm run dist:win` / `dist:linux` (and the build workflows).
#
# Each target must be built on its own OS: `files` ships the prebuilt native
# modules from the local node_modules, and those are platform-specific.
appId: dev.wilczynski.nms-companion
# Display name: install dir, Start Menu entry, Add/Remove Programs and the .exe.
# It does *not* decide where data lives — Electron derives the userData dir
# (%APPDATA%\nms-companion — catalogue DBs, settings.json, nms-keymap.json)
# from package.json "name", which every target and dev mode share.
productName: NMS Companion
directories:
  output: release

# better-sqlite3 / sharp / onnxruntime-node / koffi all ship N-API prebuilds
# that load in Electron as-is — rebuilding would only require a native
# toolchain for nothing.
npmRebuild: false

files:
  - out/**
  - package.json

# Native .node binaries and helper executables can't be loaded from inside
# an asar archive; tesseract.js also spawns workers from real file paths.
asarUnpack:
  - "**/*.node"
  - node_modules/@img/**
  - node_modules/sharp/**
  - node_modules/onnxruntime-node/**
  - node_modules/koffi/**
  - node_modules/screenshot-desktop/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**

win:
  icon: build/icon.ico
  target:
    - target: nsis # installer
    - target: portable # single self-extracting .exe
    - target: zip # unpacked folder, no extraction step

# NMS itself only runs under Proton here, so the save catalogue is the point:
# the OCR overlay depends on Win32 desktop behaviour that Wayland in particular
# doesn't offer (see src/main/services/platform.ts, which tells the user which).
linux:
  icon: build/icon.png
  category: Game
  synopsis: No Man's Sky save cataloguer and screen scanner
  # The deb target requires an email-bearing maintainer; package.json's `author`
  # has no address, and electron-builder refuses to guess one.
  maintainer: Piotr Wilczynski <delwing@gmail.com>
  target:
    - target: AppImage
    - target: deb
    - target: tar.gz

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: NMS Companion
  uninstallDisplayName: NMS Companion ${version}
  artifactName: ${name}-${version}-setup.${ext}

portable:
  artifactName: ${name}-${version}-portable.${ext}
  # Fixed name so the ~300 MB payload is extracted to %TEMP% once and reused on
  # later launches; the default is a fresh random dir per run.
  unpackDirName: NMSCompanion

# ${name}, not the default ${productName}, which would put spaces in file names.
artifactName: ${name}-${version}-${os}.${ext}
